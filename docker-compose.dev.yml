name: farmspot-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmspot_development}
      POSTGRES_USER: ${POSTGRES_USER:-farmspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmspot}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-farmspot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-farmspot}
      PGDATABASE: ${POSTGRES_DB:-farmspot_development}
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-development-only-change-me}
      APP_BASE_URL: http://localhost:8082
      NEWS_TRANSLATOR_BASE_URL: ${NEWS_TRANSLATOR_BASE_URL:-http://host.docker.internal:19191}
      NEWS_GAME_ID_BASE_URL: ${NEWS_GAME_ID_BASE_URL:-http://host.docker.internal:19192}
    volumes:
      - bundle_dev_data:/usr/local/bundle
    ports:
      - "${WEB_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["bash", "-lc", "bundle check || bundle install; bundle exec rails db:prepare; exec bundle exec puma -C config/puma.rb"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-farmspot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-farmspot}
      PGDATABASE: ${POSTGRES_DB:-farmspot_development}
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-local-development-only-change-me}
      NEWS_TRANSLATOR_BASE_URL: ${NEWS_TRANSLATOR_BASE_URL:-http://host.docker.internal:19191}
      NEWS_GAME_ID_BASE_URL: ${NEWS_GAME_ID_BASE_URL:-http://host.docker.internal:19192}
    volumes:
      - bundle_dev_data:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    entrypoint: []
    command: ["bash", "-lc", "bundle check || bundle install; exec bundle exec sidekiq -C config/sidekiq.yml"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:5173"
    depends_on:
      web:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  bundle_dev_data:
  postgres_dev_data:
  redis_dev_data:
