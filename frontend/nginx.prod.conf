# Keep the original path (before try_files internally redirects to index.html)
# and drop its query string for canonical URLs.
map $request_uri $seo_canonical_path {
  ~^([^?]*) $1;
}

server {
  listen 80;
  server_name farmspot.ru www.farmspot.ru;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  if ($host !~* ^farmspot\.ru$) {
    return 301 https://farmspot.ru$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;

  # The SPA updates SEO tags after JavaScript starts, but crawlers also read
  # the first HTML response. Give each route its own canonical URL there.
  sub_filter_types text/html;
  sub_filter_once off;
  sub_filter 'https://farmspot.ru/__CANONICAL_URL__' 'https://farmspot.ru$seo_canonical_path';

  client_max_body_size 20m;

  # Docker may restart web after nginx. Resolve the service name through the
  # embedded DNS at request time instead of caching a startup-time failure.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web_upstream http://web:3000;

  location /api/ {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /cable {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /sitemap.xml {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /sidekiq/ {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /up {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Agent catalogs must never fall through to the SPA shell. Lighthouse and
  # other agents parse these URLs as JSON and reject index.html as malformed.
  location = /ai-catalog.json {
    default_type application/ai-catalog+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /.well-known/ai-catalog.json {
    default_type application/ai-catalog+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /.well-known/ard.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints production assets, so clients can safely keep them
  # until the asset name changes in a later deployment.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
